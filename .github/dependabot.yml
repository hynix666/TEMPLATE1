# Weekly dependency updates, grouped: one pull request per ecosystem per week rather than one per
# package.
#
# Commit prefixes are types pr-title.yml accepts; any other prefix would open every update with a
# failing check. Actions are pinned to commit SHAs (verify.yml says why) and Dependabot bumps the
# SHA and its version comment together — read the upstream release before merging, because a pin
# only protects when someone looks at the new SHA.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]

  # ultra:begin go-service
  - package-ecosystem: gomod
    directory: /services/api-go
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      go:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /services/api-go
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
  # ultra:end go-service

  # ultra:begin ts-service
  - package-ecosystem: npm
    directory: /services/api-ts
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      api-ts:
        patterns: ["*"]
    ignore:
      # @types/node describes the Node that runs the code (.node-version). A newer major lets code
      # compile against APIs the runtime lacks; move it with .node-version, never ahead of it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: docker
    directory: /services/api-ts
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
  # ultra:end ts-service

  # ultra:begin web
  - package-ecosystem: npm
    directory: /apps/web
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      web:
        patterns: ["*"]
  # ultra:end web

  # ultra:begin architecture
  - package-ecosystem: npm
    directory: /architecture
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
      include: scope
    groups:
      architecture:
        patterns: ["*"]
  # ultra:end architecture

  # ultra:begin devcontainer
  - package-ecosystem: devcontainers
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: chore
  # ultra:end devcontainer
